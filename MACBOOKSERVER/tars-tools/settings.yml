use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "change_me"

search:
  formats:
    - json
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
