version: '3.8'

services:
  # === OLLAMA (the brain) ===
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"          # Open on your local network
    volumes:
      - ollama_data:/root/.ollama   # Models live here forever
    environment:
      - OLLAMA_NUM_THREADS=2        # Safe for your dual-core Core M
      - OLLAMA_KEEP_ALIVE=-1        # Keep model in RAM (faster chats)
      - OLLAMA_NUM_PARALLEL=1       # Only 1 request at a time (old CPU)
      - OLLAMA_HOST=0.0.0.0         # Allow network access
    deploy:
      resources:
        limits:
          cpus: '1.5'               # Max 1.5 cores
          memory: 5.5G              # Leaves ~2.5 GB for MacOS + WebUI
        reservations:
          cpus: '0.5'
          memory: 2G

  # === OPEN WEBUI (the nice chat interface) ===
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"                 # Access at http://your-mac-ip:8080
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=super-secret-key-change-this-later-1234567890
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

volumes:
  ollama_data:
  open_webui_data: