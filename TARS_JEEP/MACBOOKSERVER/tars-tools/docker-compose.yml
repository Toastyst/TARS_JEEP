version: '3.8'
services:
  pipelines:
    image: ghcr.io/open-webui/pipelines:latest
    ports:
      - "9099:9099"
    volumes:
      - ./tools:/app/tools
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    restart: unless-stopped
